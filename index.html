<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#1a0a1f;color:#eee;min-height:100vh}
.hdr{text-align:center;padding:8px 8px 4px;border-bottom:1px solid rgba(178,102,255,.2)}
.hdr h1{font-size:13px;color:#c084fc;letter-spacing:2px}
.hdr .s{font-size:11px;color:#ccc}
.days{display:flex;gap:0;border-bottom:2px solid rgba(178,102,255,.2)}
.day{flex:1;padding:10px 4px;text-align:center;cursor:pointer;font-size:10px;font-weight:700;color:#888;background:none;border:none;font-family:inherit;line-height:1.3}
.day .di{font-size:18px;display:block}
.day.a{color:#c084fc;background:rgba(178,102,255,.1);border-bottom:2px solid #c084fc;margin-bottom:-2px}
.day.past{opacity:.4;text-decoration:line-through}
.day.today{position:relative}
.day.today::after{content:'HOY';position:absolute;top:2px;right:2px;font-size:7px;background:#c084fc;color:#fff;padding:1px 3px;border-radius:3px}
.bar{display:flex;justify-content:space-around;padding:5px;background:rgba(0,0,0,.3)}
.bar .v{font-size:15px;font-weight:700;color:#c084fc}
.bar .l{font-size:10px;color:#ccc}
.tools{padding:5px;display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.btn{background:rgba(178,102,255,.12);border:1px solid #7c3aed;color:#c084fc;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600}
.btn.on{background:rgba(76,175,80,.3);border-color:#4CAF50;color:#90EE90}
.cfg{margin:4px 8px;padding:8px;background:rgba(0,0,0,.3);border-radius:6px;border:1px solid rgba(178,102,255,.2);display:none}
.cfg.open{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.cfg label{font-size:11px;color:#ccc;display:block;margin-bottom:2px}
.cfg input{background:rgba(0,0,0,.4);border:1px solid #666;color:#fff;padding:6px;border-radius:4px;width:100%;text-align:center;font-size:16px}
#map{width:100%;height:52vh;min-height:280px}
.mapbtn{background:rgba(0,0,0,.75);border:1px solid #666;color:#fff;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;backdrop-filter:blur(4px)}
.notice{text-align:center;padding:6px;font-size:13px;color:#c084fc;background:rgba(178,102,255,.08);display:none}
.notice.show{display:block}
.vtabs{display:flex;border-bottom:1px solid rgba(178,102,255,.15)}
.vtab{flex:1;padding:8px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:#888;border:none;background:none}
.vtab.a{color:#c084fc;border-bottom:2px solid #c084fc;margin-bottom:-1px}
.pnl{display:none}.pnl.a{display:block}
.tbl{margin:6px;background:rgba(0,0,0,.2);border-radius:6px;border:1px solid rgba(178,102,255,.15);overflow:hidden;max-height:50vh;overflow-y:auto}
.tbl .th{display:grid;grid-template-columns:32px 1fr 65px;padding:6px 8px;font-size:12px;font-weight:700;color:#c084fc;background:rgba(178,102,255,.1);position:sticky;top:0}
.tbl .tr{display:grid;grid-template-columns:32px 1fr 65px;padding:8px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.tbl .tr:active{background:rgba(178,102,255,.1)}
.tbl .rn{font-weight:700;color:#c084fc;font-size:15px}.tbl .rt{text-align:right;font-weight:700;color:#c084fc;align-self:center;font-size:13px}
.tbl .rs{font-size:11px;color:#aaa}
.ftr{padding:6px 8px;margin:4px 8px 10px;background:rgba(255,255,255,.04);border-radius:6px;font-size:11px;color:#aaa;line-height:1.4}
/* EN VIVO */
.live-card{background:rgba(0,0,0,.3);border:1px solid rgba(178,102,255,.2);border-radius:10px;padding:14px;margin-bottom:10px;text-align:center}
.live-next{background:linear-gradient(135deg,rgba(178,102,255,.1),rgba(178,102,255,.05));border:2px solid #c084fc;border-radius:12px;padding:18px 14px;margin-bottom:12px;text-align:center}
.live-next .ln-label{font-size:13px;color:#ccc;text-transform:uppercase;letter-spacing:1px}
.live-next .ln-num{font-size:48px;font-weight:700;color:#c084fc;line-height:1.1}
.live-next .ln-ref{font-size:16px;color:#fff;margin-top:6px}
.live-next .ln-time{font-size:20px;color:#c084fc;margin-top:6px}
.live-progress{background:rgba(0,0,0,.4);border-radius:20px;height:26px;overflow:hidden;margin:10px 0;border:1px solid rgba(178,102,255,.2)}
.live-progress-bar{height:100%;background:linear-gradient(90deg,#c084fc,#7c3aed);border-radius:20px;transition:width .5s;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#111}
.live-btn{width:100%;padding:18px;border:none;border-radius:10px;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer;margin-bottom:8px}
.live-btn-done{background:#4CAF50;color:#fff}
.live-btn-done:active{background:#388E3C}
.live-btn-undo{background:rgba(178,102,255,.1);color:#c084fc;border:1px solid #7c3aed;font-size:14px;padding:12px}
.live-carry{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(255,255,255,.1)}
.live-carry.done{background:rgba(76,175,80,.1);border-color:rgba(76,175,80,.3)}
.live-carry.pending{background:rgba(255,255,255,.03)}
.live-carry.current{background:rgba(178,102,255,.1);border-color:#c084fc;border-width:2px}
.live-carry .lc-num{font-size:20px;font-weight:700;width:32px}
.live-carry .lc-info{flex:1;padding:0 8px}
.live-carry .lc-ref{font-size:14px;font-weight:600;color:#fff}
.live-carry .lc-sub{font-size:11px;color:#aaa}
.live-carry .lc-time{font-size:15px;font-weight:700}
.live-carry.done .lc-num{color:#4CAF50}
.live-carry.current .lc-num{color:#c084fc}
.live-carry.pending .lc-num{color:#666}
.rfloat{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:2000;background:#d4af37;color:#1a0a02;font-weight:700;font-size:12px;padding:9px 18px;border-radius:22px;box-shadow:0 3px 12px rgba(212,175,55,.5);cursor:pointer;border:none}
.rfloat.show{display:block}
@keyframes flashPulse{0%,100%{opacity:1}50%{opacity:0.3}}
.flash{animation:flashPulse 0.8s ease-in-out 6}

<div class="hdr">
  <div style="font-size:16px;color:#c084fc">✝</div>
  <h1>SEMANA SANTA · SONSONATE</h1>
  <div class="s" id="hSub"></div>
  <div id="onlineCounter" style="display:none;font-size:10px;color:#4CAF50;margin-top:2px"></div>
</div>

<!-- Live broadcast banner (everyone sees) -->
<div id="broadcastBanner" style="display:none;padding:10px;background:rgba(255,152,0,.12);border-bottom:1px solid rgba(255,152,0,.3);text-align:center">
  <div style="font-size:13px;color:#ff9800;font-weight:700" id="broadcastText"></div>
  <div style="font-size:9px;color:#888;margin-top:2px" id="broadcastTime"></div>
</div>

<!-- Admin broadcast input (only editor) -->
<div id="broadcastInput" style="display:none;padding:8px;background:rgba(0,0,0,.3);border-bottom:1px solid rgba(124,58,237,.2)">
  <div style="display:flex;gap:6px">
    <input type="text" id="broadcastMsg" placeholder="Escribí un mensaje en vivo..." style="flex:1;padding:8px;border:1px solid #666;border-radius:8px;background:rgba(0,0,0,.4);color:#fff;font-size:13px;font-family:inherit">
    <button onclick="sendBroadcast()" style="padding:8px 14px;border:none;border-radius:8px;background:#ff9800;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit">📢</button>
    <button onclick="clearBroadcast()" style="padding:8px;border:1px solid #666;border-radius:8px;background:none;color:#888;font-size:11px;cursor:pointer;font-family:inherit">✕</button>
  </div>
</div>

<!-- Carry alert banner -->

<div id="installBanner" style="display:none;padding:10px;background:rgba(124,58,237,.15);border-bottom:1px solid rgba(124,58,237,.3);text-align:center;cursor:pointer;position:relative" onclick="installApp()">
  <span style="font-size:13px;color:#c084fc">📱 <b>Tocá aquí para instalar la app</b></span>
  <br><span style="font-size:11px;color:#aaa">Se agrega a tu pantalla de inicio · Funciona sin internet</span>
  <span onclick="event.stopPropagation();dismissInstall()" style="position:absolute;right:10px;top:8px;color:#666;font-size:16px;cursor:pointer">✕</span>
</div>

<div class="days">
  <button class="day a" onclick="switchDay(0)"><span class="di">Ⓛ</span>LUN</button>
  <button class="day" onclick="switchDay(1)"><span class="di">Ⓜ</span>MAR</button>
  <button class="day" onclick="switchDay(2)"><span class="di">Ⓜ</span>MIÉ</button>
  <button class="day" onclick="switchDay(3)"><span class="di">Ⓥ</span>VIE</button>
</div>

<div class="tools">
  <button class="btn" onclick="document.getElementById('cfgP').classList.toggle('open')">⚙️ Mi Grupo</button>
  <button class="btn" onclick="shareWhatsApp()">📤 Compartir</button>
  <button class="btn" onclick="resetData()" style="border-color:#914444;color:#e08080">🗑️</button>
</div>
<div class="cfg" id="cfgP">
  <div><label>¿Cargadores de?</label><select id="cType" onchange="onTypeChange()" style="background:rgba(0,0,0,.4);border:1px solid #666;color:#fff;padding:6px;border-radius:4px;width:100%;font-size:16px"><option value="21">Hombres (21 grupos)</option><option value="27">Mujeres (27 grupos)</option></select></div>
  <div><label>¿En qué grupo vas?</label><input type="number" id="cG" value="5" min="1" max="50" onchange="calc()"></div>
  <div id="colorDiv" style="display:none"><label>¿Tu color?</label><select id="cColor" onchange="calc()" style="background:rgba(0,0,0,.4);border:1px solid #666;color:#fff;padding:6px;border-radius:4px;width:100%;font-size:16px"><option value="0">🟡 Amarillo</option><option value="1">🔴 Rojo</option><option value="2">🔵 Azul</option></select></div>
  <div class="adminOnly"><label>¿Qué grupo saca?</label><input type="number" id="cS" value="19" min="1" max="50" onchange="daySacaManual[currentDay]=true;if(+$('cType').value===27){daySacaMuj[currentDay]=+this.value;if(liveGrupoData){liveGrupoData.sacaMuj=+this.value;db.ref('grupoActual/day'+currentDay).set(liveGrupoData);}updateGrupoUI();}calc()"></div>
  <div class="adminOnly"><label>Hora de salida</label><input type="number" id="cH" value="15" min="0" max="23" onchange="calc()"></div>
  <div class="adminOnly"><label>Min por cambio</label><input type="number" id="cMn" value="6" min="1" max="20" onchange="calc()"></div>
</div>

<div class="vtabs">
  <button class="vtab" onclick="showView(0)">🗺️ MAPA</button>
  <button class="vtab a" onclick="showView(1)" style="font-weight:700">✝️ AVANCE</button>
</div>

<div class="pnl" id="v0">

    <div id="map"></div>

    <div id="mapEditBar" style="position:absolute;top:8px;right:8px;z-index:1000;display:flex;flex-direction:column;gap:5px">

    </div>
    <div id="mapEditTools" style="position:absolute;top:8px;right:8px;z-index:1000;display:none;flex-direction:column;gap:5px">

      <button id="bDrag" onclick="toggleDrag()" class="mapbtn">🔀 Mover</button>
      <button onclick="addRef()" class="mapbtn">📌 Ref</button>
      <button onclick="exportPoints()" class="mapbtn">📤 Exportar</button>
    </div>
    <!-- Left side: view controls -->
    <div style="position:absolute;top:8px;left:8px;z-index:1000;display:flex;flex-direction:column;gap:5px">
      <button id="bGps" onclick="toggleGps()" class="mapbtn">📍 Mi Ubicación</button>
      <button id="bAll" onclick="toggleAll()" class="mapbtn">👥 Ver otros grupos</button>
      <button id="bUrna" onclick="toggleUrna('jesus')" class="mapbtn" style="display:none;background:rgba(220,38,38,.8);border-color:#dc2626">✝️ Anda Jesús</button>
      <button id="bUrnaV" onclick="toggleUrna('virgen')" class="mapbtn" style="display:none;background:rgba(59,130,246,.8);border-color:#3b82f6">👑 Anda Virgen</button>
    </div>
  </div>
</div>
<div class="pnl a" id="v1">

</div>
<div id="tbl" style="display:none"></div>

  <div style="max-width:340px;width:100%;margin:auto">
    <!-- Step 1: Choose type -->
    <div id="step1" style="text-align:center">
      <div style="font-size:16px;color:#c084fc;font-weight:700;margin-bottom:4px">✝️ SEMANA SANTA</div>
      <div style="font-size:12px;color:#ccc;margin-bottom:16px" id="sharedDayLabel"></div>
      <div style="font-size:14px;color:#eee;margin-bottom:14px;font-weight:600">¿Qué cargás?</div>
      <div style="display:flex;gap:12px;justify-content:center">
        <div onclick="pickType(21)" style="cursor:pointer;flex:1;background:#1a0a1f;border:2px solid #7c3aed;border-radius:14px;padding:12px;text-align:center">
          <img src="jesus.jpg" style="width:100%;border-radius:10px;margin-bottom:8px">
          <div style="font-size:14px;color:#c084fc;font-weight:700">CARGADOR</div>
          <div style="font-size:11px;color:#aaa">21 grupos</div>
        </div>
        <div onclick="pickType(27)" style="cursor:pointer;flex:1;background:#1a0a1f;border:2px solid #7c3aed;border-radius:14px;padding:12px;text-align:center">
          <img src="maria.jpg" style="width:100%;border-radius:10px;margin-bottom:8px">
          <div style="font-size:14px;color:#c084fc;font-weight:700">CARGADORA</div>
          <div style="font-size:11px;color:#aaa">27 grupos</div>
        </div>
      </div>
    </div>

    <!-- Step 2: Color (only for women) -->
    <div id="step2" style="display:none;text-align:center">
      <div style="font-size:14px;color:#eee;margin-bottom:14px;font-weight:600">¿Tu color?</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button onclick="pickColor(0)" style="flex:1;padding:16px;border:2px solid #fbbf24;border-radius:12px;background:rgba(251,191,36,.15);font-size:24px;cursor:pointer">🟡<br><span style="font-size:12px;color:#fbbf24">Amarillo</span></button>
        <button onclick="pickColor(1)" style="flex:1;padding:16px;border:2px solid #ef4444;border-radius:12px;background:rgba(239,68,68,.15);font-size:24px;cursor:pointer">🔴<br><span style="font-size:12px;color:#ef4444">Rojo</span></button>
        <button onclick="pickColor(2)" style="flex:1;padding:16px;border:2px solid #3b82f6;border-radius:12px;background:rgba(59,130,246,.15);font-size:24px;cursor:pointer">🔵<br><span style="font-size:12px;color:#3b82f6">Azul</span></button>
      </div>
      <button onclick="$('step2').style.display='none';$('step1').style.display='block'" style="margin-top:12px;background:none;border:none;color:#888;font-size:12px;cursor:pointer;font-family:inherit">← Atrás</button>
    </div>

    <!-- Step 3: Group number grid -->
    <div id="step3" style="display:none;text-align:center">
      <div style="font-size:14px;color:#eee;margin-bottom:4px;font-weight:600">¿Tu grupo?</div>
      <div style="font-size:11px;color:#aaa;margin-bottom:12px" id="step3label"></div>
      <div id="groupGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px"></div>
      <button onclick="$('step3').style.display='none';sharedPickedType===27?($('step2').style.display='block'):($('step1').style.display='block')" style="margin-top:12px;background:none;border:none;color:#888;font-size:12px;cursor:pointer;font-family:inherit">← Atrás</button>
    </div>
  </div>
</div>

function detectToday(){
  const now=new Date();
  // If before 5 AM, consider it still the previous day's procession
  let checkDate=new Date(now);
  if(now.getHours()<5){
    checkDate.setDate(checkDate.getDate()-1);
  }
  const today=checkDate.toISOString().slice(0,10);
  let todayIdx=-1;
  dayDates.forEach((d,i)=>{if(d===today)todayIdx=i;});
  // Mark past/today on tabs
  document.querySelectorAll('.day').forEach((btn,i)=>{
    const date=new Date(dayDates[i]+'T12:00:00');
    const ref=new Date();
    ref.setHours(12,0,0,0);
    if(date<ref&&dayDates[i]!==today) btn.classList.add('past');
    if(dayDates[i]===today) btn.classList.add('today');
  });
  return todayIdx;
} // true if user manually set saca

// ========== LOCAL STORAGE ==========
const SAVE_KEY = 'semanaSanta_v42';
function getWPs(){return currentDay===0?LUN_WP_REF:currentDay===1?MART_WP_REF:currentDay===2?MIER_WP_REF:currentDay===3?VIER_WP_REF:[];}
function saveAll() {
  try {
    savedPositions[currentDay] = positions.map(p=>({lat:p.lat,lng:p.lng,n:p.n||''}));
    savedRefs[currentDay] = getWPs().map(w=>({lat:w.lat,lng:w.lng,n:w.n}));
    const data = {
      sp: savedPositions, sr: savedRefs,
      sc: daySaca, sh: dayHours, sm: daySacaManual,
      cfg: {g:+$('cG').value,t:+$('cType').value,mn:+$('cMn').value,color:+($('cColor')?$('cColor').value:0)},
      cd: currentDay,
      ga: liveGrupoData ? {d:currentDay, data:liveGrupoData} : null
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch(e) {}
}
// Separate function to sync positions - only call after actual edits
function syncAndSave(){
  saveAll();
  if(typeof syncPositions==='function') syncPositions();
}
function loadSaved() {
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if(!raw){
      for(let v=42;v>=13;v--){
        raw=localStorage.getItem('semanaSanta_v'+v);
        if(raw){
          localStorage.setItem(SAVE_KEY,raw);
          localStorage.removeItem('semanaSanta_v'+v);
          break;
        }
      }
    }
    if(!raw) return false;
    const d = JSON.parse(raw);
    // Load saved positions (admin uses these, shared users use KML)
    if(d.sp) savedPositions = d.sp;
    // Only load refs if user added custom ones
    if(d.sr) savedRefs = d.sr;
    if(d.sc) daySaca = d.sc;
    if(d.sh) dayHours = d.sh;
    if(d.sm) daySacaManual = d.sm;
    if(d.cfg){$('cG').value=d.cfg.g||5;$('cType').value=d.cfg.t||21;$('cMn').value=d.cfg.mn||6;if(d.cfg.color!==undefined)$('cColor').value=d.cfg.color;$('colorDiv').style.display=(+$('cType').value===27)?'block':'none';}
    if(typeof d.cd==='number') currentDay = d.cd;
    // Restore grupo actual
    if(d.ga&&d.ga.data&&d.ga.d===currentDay){
      liveGrupoData=d.ga.data;
      currentGrupoActual=d.ga.data.cambio||0;
      if(d.ga.data.desfase!==undefined) virgenDesfase=d.ga.data.desfase;
      if(d.ga.data.movidos!==undefined) virgenMovidos=d.ga.data.movidos;
      if(d.ga.data.sacaMuj) daySacaMuj[currentDay]=d.ga.data.sacaMuj;
    }
    if(savedRefs[0]&&savedRefs[0].length){LUN_WP_REF.length=0;savedRefs[0].forEach(r=>LUN_WP_REF.push(r));}
    if(savedRefs[1]&&savedRefs[1].length){MART_WP_REF.length=0;savedRefs[1].forEach(r=>MART_WP_REF.push(r));}
    if(savedRefs[2]&&savedRefs[2].length){MIER_WP_REF.length=0;savedRefs[2].forEach(r=>MIER_WP_REF.push(r));}
    if(savedRefs[3]&&savedRefs[3].length){VIER_WP_REF.length=0;savedRefs[3].forEach(r=>VIER_WP_REF.push(r));}
    return true;
  } catch(e){return false;}
}
function resetData(){
  if(!confirm('¿Borrar TODO el progreso guardado?')) return;
  localStorage.removeItem(SAVE_KEY);
  savedPositions=[null,null,null,null];savedRefs=[null,null,null,null];
  location.reload();
}

function fmt(min) {
  let h=Math.floor(min/60), m=Math.round(min%60);
  if(m===60){h++;m=0}
  let h12=((h-1)%12)+1; if(h12<=0)h12+=12;
  return h12+':'+String(m).padStart(2,'0')+' '+(h>=12&&h<24?'PM':'AM');
}
function hd(a,b){const R=6371000,d1=(b.lat-a.lat)*Math.PI/180,d2=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(d1/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(d2/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function placeAlong(path,intv){const r=[];if(path.length<2)return r;let a=0;for(let i=1;i<path.length;i++){const p=path[i-1],q=path[i],s=hd(p,q);if(s<.1)continue;let u=0;while(a+(s-u)>=intv){const ad=intv-a;u+=ad;const f=u/s;r.push({lat:p.lat+(q.lat-p.lat)*f,lng:p.lng+(q.lng-p.lng)*f});a=0;}a+=(s-u);}return r;}

// ========== DAY SWITCHING ==========
function getLastGroup(day){
  // Calculate which group "enters" (last change) for a given day
  const s=daySaca[day]||19;
  const t=+$('cType').value||21;
  const pts=day===0?LUN_PTS:day===1?MART_PTS:day===2?MIER_PTS:day===3?VIER_PTS:[];
  const tot=pts.length;
  if(tot===0) return s;
  return ((s-1+tot-1)%t)+1;
}

function switchDay(d) {
  // Save current day's state
  if(+$('cType').value===27){
    daySacaMuj[currentDay]=+$('cS').value||13;
  } else {
    daySaca[currentDay]=+$('cS').value||19;
  }
  dayHours[currentDay] = +$('cH').value||15;
  saveAll();

  // Auto-calculate saca for the new day if not manually set
  // Next day's saca = previous day's last group + 1
  if(d>0 && !daySacaManual[d]){
    const prevDay=d-1;
    const lastGrp=getLastGroup(prevDay);
    const t=+$('cType').value||21;
    daySaca[d]=((lastGrp)%t)+1; // lastGroup+1, wrap around
  }

  currentDay = d;
  document.querySelectorAll('.day').forEach((b,i) => b.classList.toggle('a',i===d));

  // Restore config for this day
  var isM=(+$('cType').value===27);
  $('cS').value = isM?daySacaMuj[d]:daySaca[d];
  $('cH').value = dayHours[d];


  loadDay(d);
  // Reset grupo actual for new day and restart listeners
  currentGrupoActual=0;
  liveGrupoData=null;
  if(typeof stopDayListeners==='function') stopDayListeners();
  if(typeof startDayListeners==='function') startDayListeners();
}

function loadDay(d) {
  // Clear map
  allMarkers.forEach(m=>m.setMap(null));
  wpMarkers.forEach(m=>m.setMap(null));
  allMarkers=[]; wpMarkers=[];
  if(routeLine){routeLine.setMap(null);routeLine=null;}
  if(routeClickLine){routeClickLine.setMap(null);routeClickLine=null;}
  $('noti').classList.remove('show');

  // Admin: load saved edits if available. Shared: always KML
  const dayPts=[LUN_PTS,MART_PTS,MIER_PTS,VIER_PTS];
  if(!isShared && savedPositions[d] && savedPositions[d].length>0){
    positions = savedPositions[d].map(p=>({lat:p.lat,lng:p.lng,n:p.n||''}));
  } else if(dayPts[d] && dayPts[d].length>0){
    positions = dayPts[d].map(p=>({lat:p.lat,lng:p.lng,n:p.n}));
  }
  if(positions.length>0){
    drawRouteLine();
    calc();
    fitBounds();
  }
}

// ========== MIÉRCOLES: draw polyline through exact points ==========
function drawRouteLine() {
  if(routeLine) routeLine.setMap(null);
  if(routeClickLine) routeClickLine.setMap(null);
  const path = positions.map(p=>({lat:p.lat,lng:p.lng}));
  routeLine = new google.maps.Polyline({
    path, map:gmap, strokeColor:'#9333ea', strokeWeight:5, strokeOpacity:.8, zIndex:1
  });
  // Fat invisible line for easy tapping
  routeClickLine = new google.maps.Polyline({
    path, map:gmap, strokeColor:'#9333ea', strokeWeight:25, strokeOpacity:0.01, zIndex:2
  });
  routeClickLine.addListener('click', function(e){
    if(isZoom()) return;
    // e.edge = index of the segment clicked (Google Maps provides this)
    insertAtPosition(e.latLng.lat(), e.latLng.lng(), e.edge);
  });
}

function fitBounds() {
  if(positions.length<2) return;
  const b = new google.maps.LatLngBounds();
  positions.forEach(p=>b.extend(p));
  gmap.fitBounds(b,{top:20,bottom:20,left:20,right:20});
}

// ========== INSERT CHANGE (tap on route line) ==========
function insertAtPosition(lat,lng,edge) {
  if(!editMode||isShared) return;
  if(positions.length<2) return;

  // Google Maps gives us the edge (segment) index that was clicked
  // edge = index of segment between positions[edge] and positions[edge+1]
  let insertIdx;
  if(typeof edge==='number' && edge>=0 && edge<positions.length){
    insertIdx=edge+1; // insert after the start of the clicked segment
  } else {
    // Fallback: find closest segment
    let bestSeg=0, bestD=Infinity;
    for(let i=0;i<positions.length-1;i++){
      const d=distToSegment({lat,lng},positions[i],positions[i+1]);
      if(d<bestD){bestD=d;bestSeg=i;}
    }
    insertIdx=bestSeg+1;
  }

  positions.splice(insertIdx,0,{lat,lng,n:''});

  drawRouteLine();
  calc();
  if(typeof syncPositions==='function') syncPositions();

  const c=cfg();
  const grp=((c.s-1+insertIdx)%c.t)+1;
  const num=insertIdx+1;
  infoWin.setContent('<div style="text-align:center;font-family:Georgia;color:#111;font-size:13px"><b style="color:#2e7d32;font-size:15px">✅ Cambio #'+num+'</b><br>Grupo <b>#'+grp+'</b><br><span style="font-size:11px;color:#777">Secuencia actualizada</span></div>');
  infoWin.setPosition({lat,lng});
  infoWin.open(gmap);
  setTimeout(()=>infoWin.close(),2500);
}

// Distance from point p to line segment a→b
function distToSegment(p,a,b){
  const dx=b.lng-a.lng, dy=b.lat-a.lat;
  const len2=dx*dx+dy*dy;
  if(len2===0) return hd(p,a);
  let t=((p.lng-a.lng)*dx+(p.lat-a.lat)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  const proj={lat:a.lat+t*dy, lng:a.lng+t*dx};
  return hd(p,proj);
}

// Snap a GPS point to the nearest position on the route
// Get effective cambio for current user (Virgen is ~5 behind Jesus)
function getEffCambio(){
  if(!window.liveGrupoData||!window.liveGrupoData.cambio) return 0;
  var c=window.liveGrupoData.cambio;
  var cc=cfg();
  if(cc.t===27){
    var desf=window.liveGrupoData.desfase!==undefined?window.liveGrupoData.desfase:virgenDesfase;
    c=Math.max(0,c-desf);
  }
  return c;
}

function snapToRoute(p){
  var pts=positions;
  if(!pts||pts.length<2){
    var dayPtsArr=[LUN_PTS,MART_PTS,MIER_PTS,VIER_PTS];
    pts=dayPtsArr[currentDay]||[];
  }
  if(pts.length<2) return p;
  
  // If grupo actual is set, only search nearby segments (±15 changes)
  var startIdx=0, endIdx=pts.length-1;
  var effSnap=getEffCambio();
  if(effSnap>0){
    var curr=effSnap-1;
    startIdx=Math.max(0,curr-15);
    endIdx=Math.min(pts.length-1,curr+15);
  }
  
  let bestD=Infinity, bestProj=p;
  for(let i=startIdx;i<endIdx;i++){
    const a=pts[i], b=pts[i+1];
    const dx=b.lng-a.lng, dy=b.lat-a.lat;
    const len2=dx*dx+dy*dy;
    if(len2===0) continue;
    let t=((p.lng-a.lng)*dx+(p.lat-a.lat)*dy)/len2;
    t=Math.max(0,Math.min(1,t));
    const proj={lat:a.lat+t*dy, lng:a.lng+t*dx};
    const d=hd(p,proj);
    if(d<bestD){bestD=d;bestProj=proj;}
  }
  return bestProj;
}

// ========== CALCULATE ==========
// Viernes special timing
const VIER_CORTESIAS_CHANGE = 32; // cortesías start after this change (~11:25 AM)
const VIER_CORTESIAS_MIN = 45;    // 45 min pause (11:30-12:00)
const VIER_LAST_EXTRA = 0.10;     // last change 10% longer

function calcTime(num, tot, c) {
  if(currentDay !== 3) {
    // Simple: fixed min/change
    return c.h * 60 + num * c.mn;
  }
  // VIERNES: variable timing
  // Total time = 480 min (6AM-2PM), minus 45 cortesías = 450 carrying min
  const totalMin = 480;
  const carryMin = totalMin - VIER_CORTESIAS_MIN;
  // 43 normal + 1 at 130% = 44.3 units
  const units = (tot - 1) + 1.3;
  const minPerChange = carryMin / units;
  const lastMin = minPerChange * 1.3;

  let elapsed = 0;
  for(let i = 1; i <= num; i++) {
    if(i === tot) {
      elapsed += lastMin; // last change is longer
    } else {
      elapsed += minPerChange;
    }
    // Add cortesías pause after the cortesías change
    if(i === VIER_CORTESIAS_CHANGE) {
      elapsed += VIER_CORTESIAS_MIN;
    }
  }
  return c.h * 60 + elapsed;
}

function calc() {
  const c=cfg();
  const tot=positions.length;
  // Keep shared user prefs updated
  if(isShared) localStorage.setItem('sharedUser',JSON.stringify({t:c.t,g:c.g,color:c.color}));

  changes=positions.map((p,i)=>{
    const num=i+1;
    const grp=((c.s-1+i)%c.t)+1;
    const timeMin=calcTime(num, tot, c);
    const isCortesia=(currentDay===3 && num===VIER_CORTESIAS_CHANGE);
    return {num,grp,time:fmt(timeMin),lat:p.lat,lng:p.lng,n:p.n||'',mine:grp===c.g,cortesia:isCortesia};
  });
  myCarries=changes.filter(ch=>ch.mine);
  const isMujeres=c.t===27;
  const colores=['🟡','🔴','🔵'];
  const colorNames=['Amarillo','Rojo','Azul'];
  const colorHex=['#fbbf24','#ef4444','#3b82f6'];
  myCarries.forEach((mc,i)=>{
    mc.ci=i+1;
    if(isMujeres){
      mc.colorIdx=c.color;
      mc.colorIcon=colores[mc.colorIdx];
      mc.colorName=colorNames[mc.colorIdx];
      mc.colorHex=colorHex[mc.colorIdx];
      // Santos rotate colors each change
      const santoColor=(mc.colorIdx+i)%3;
      mc.santoColorIcon=colores[santoColor];
      mc.carryLabel='👑 Virgen + '+mc.santoColorIcon+' Santo';
    }
  });

  let totalM=0;
  for(let i=1;i<positions.length;i++) totalM+=hd(positions[i-1],positions[i]);
  const km=(totalM/1000).toFixed(2);

  // Estimated end time - use real average if available
  let endTime=tot>0?calcTime(tot,tot,c):c.h*60;
  let endLabel='Entra (est.)';
  const realAvg=getRealAvg();
  if(realAvg && doneCount()>0){
    // Project from last recorded carry
    const recorded=myCarries.filter(x=>isDone(x.ci)).map(x=>({num:x.num,t:getEntry(x.ci).t})).sort((a,b)=>b.num-a.num);
    if(recorded.length>0){
      const last=recorded[0];
      const changesLeft=tot-last.num;
      const estMs=last.t+changesLeft*realAvg*60000;
      const estDate=new Date(estMs);
      const h=estDate.getHours(),m=estDate.getMinutes();
      endTime=h*60+m;
      endLabel='Entra (real)';
    }
  }
  // Last group that enters
  const lastGrp=((c.s-1+tot-1)%c.t)+1;

  let extra=currentDay===3?' · ✝️ Cortesías ~11:30':'';
  const dateStr=dayDates[currentDay]?dayDates[currentDay].slice(5).replace('-','/'):'';
  $('hSub').textContent=dayNames[currentDay]+' '+dateStr+' · Grupo #'+c.g+' · Saca #'+c.s+' → Entra #'+lastGrp+extra;
  const isMuj=c.t===27;

  renderTable();
  renderLive();
  renderMarkers();
  renderWPmarkers();
  saveAll();
}

// Calculate real average min/change, ignoring outliers
function getRealAvg(){
  const entries=[];
  myCarries.forEach(mc=>{
    const e=getEntry(mc.ci);
    if(e) entries.push({ci:mc.ci, num:mc.num, t:e.t});
  });
  if(entries.length<2) return null;
  entries.sort((a,b)=>a.num-b.num);
  
  // Calculate per-segment rates
  const rates=[];
  for(let i=1;i<entries.length;i++){
    const diffMin=(entries[i].t-entries[i-1].t)/60000;
    const diffChanges=entries[i].num-entries[i-1].num;
    if(diffMin>0&&diffChanges>0) rates.push(diffMin/diffChanges);
  }
  if(rates.length===0) return null;
  
  // Find median
  const sorted=[...rates].sort((a,b)=>a-b);
  const median=sorted[Math.floor(sorted.length/2)];
  
  // Keep only rates within 2x of median (ignore extreme outliers)
  const filtered=rates.filter(r=>r>=median*0.3&&r<=median*2.5);
  if(filtered.length===0) return median;
  
  return filtered.reduce((a,b)=>a+b,0)/filtered.length;
}

// Get last recorded time and project forward
function getEstimate(mc){
  const now=Date.now();
  
  // BEST METHOD: Use grupo actual if available
  if(window.liveGrupoData&&window.liveGrupoData.cambio>0&&window.liveGrupoData.t){
    var gCambio=window.liveGrupoData.cambio;
    var gTime=window.liveGrupoData.t;
    var cc=cfg();
    var startDate=new Date();
    startDate.setHours(cc.h,0,0,0);
    if(now<startDate.getTime()) startDate.setDate(startDate.getDate()-1);
    var startMs=startDate.getTime();
    var elapsedG=(gTime-startMs)/60000;
    if(elapsedG>0&&gCambio>0){
      var realMpc=elapsedG/gCambio;
      if(mc.num<=gCambio) return fmtClock(startMs+mc.num*realMpc*60000);
      return fmtClock(gTime+(mc.num-gCambio)*realMpc*60000);
    }
  }

  const recorded=myCarries.filter(x=>isDone(x.ci)).map(x=>({num:x.num,t:getEntry(x.ci).t})).sort((a,b)=>b.num-a.num);
  const avg=getRealAvg();
  const minPer=avg||(+$('cMn').value||6);
  
  if(recorded.length===0){
    // No data yet — check if procession is running late
    // Parse initial estimate to ms
    const initMs=parseTimeToMs(mc.time);
    if(!initMs) return mc.time;
    // Find the first pending carry
    const firstPending=myCarries.find(x=>!isDone(x.ci));
    if(firstPending){
      const firstMs=parseTimeToMs(firstPending.time);
      if(firstMs && now>firstMs+60000){ // at least 1 min late
        // Procession is late — project from now
        const changesAhead=mc.num-firstPending.num;
        const estMs=now+changesAhead*minPer*60000;
        return fmtClock(estMs);
      }
    }
    return mc.time;
  }
  
  const last=recorded[0];
  const changesAhead=mc.num-last.num;
  if(changesAhead<=0) return mc.time;
  let estMs=last.t+changesAhead*minPer*60000;
  
  // If current time is past the projection, the procession is delayed
  // Use current time as baseline for the next pending carry
  const nextPending=myCarries.find(x=>!isDone(x.ci));
  if(nextPending && mc.ci===nextPending.ci && now>estMs+60000){
    estMs=now; // this carry should be happening now
  } else if(nextPending && mc.ci>nextPending.ci && now>estMs){
    // Future carry — project from current time relative to next pending
    const changesFromNext=mc.num-nextPending.num;
    const nextEstMs=last.t+(nextPending.num-last.num)*minPer*60000;
    const baseTime=Math.max(nextEstMs,now);
    estMs=baseTime+changesFromNext*minPer*60000;
  }
  
  return fmtClock(estMs);
}

function parseTimeToMs(timeStr){
  const tp=timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!tp) return null;
  let h=parseInt(tp[1]),m=parseInt(tp[2]);
  if(tp[3].toUpperCase()==='PM'&&h<12)h+=12;
  if(tp[3].toUpperCase()==='AM'&&h===12)h=0;
  const d=new Date();d.setHours(h,m,0,0);
  return d.getTime();
}

function fmtClock(ts){
  const d=new Date(ts);
  let h=d.getHours(),m=d.getMinutes();
  let h12=((h-1)%12)+1;if(h12<=0)h12+=12;
  return h12+':'+String(m).padStart(2,'0')+' '+(h>=12&&h<24?'PM':'AM');
}

function nearWP(p){
  const wps = getWPs();
  let b='Punto',bd=1e9;
  wps.forEach(w=>{const d=hd(p,w);if(d<bd){bd=d;b=w.n;}});
  return b;
}
function zoomTo(i){
  if(!myCarries[i])return;
  showView(0);
  const mc=myCarries[i];
  gmap.setCenter({lat:mc.lat,lng:mc.lng});
  gmap.setZoom(20);
  setTimeout(function(){
    const t=allMarkers.find(m=>{const p=m.getPosition();return Math.abs(p.lat()-mc.lat)<.0001&&Math.abs(p.lng()-mc.lng)<.0001;});
    if(t) google.maps.event.trigger(t,'click');
  },300);
}

// ========== GPS TRACKING ==========
let gpsMarker=null, gpsCircle=null, gpsWatchId=null, gpsOn=false;

function toggleGps(){
  if(gpsOn){
    if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}
    if(gpsMarker){gpsMarker.setMap(null);gpsMarker=null;}
    if(gpsCircle){gpsCircle.setMap(null);gpsCircle=null;}
    gpsOn=false;
    $('bGps').style.background='rgba(0,0,0,.75)';
    $('noti').classList.remove('show');
    calc(); // restore footer
    return;
  }
  if(!navigator.geolocation){
    $('noti').textContent='❌ Tu navegador no soporta GPS';
    $('noti').classList.add('show');
    return;
  }
  gpsOn=true;
  $('bGps').style.background='rgba(66,133,244,.8)';
  $('noti').textContent='📍 Buscando ubicación...';
  $('noti').classList.add('show');

  gpsWatchId=navigator.geolocation.watchPosition(
    function(pos){
      const lat=pos.coords.latitude, lng=pos.coords.longitude, acc=pos.coords.accuracy;
      const ll={lat,lng};
      $('noti').classList.remove('show');
      if(!gpsMarker){
        gpsMarker=new google.maps.Marker({
          position:ll, map:gmap, zIndex:9000,
          icon:{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:'#4285F4',fillOpacity:1,strokeColor:'#fff',strokeWeight:3}
        });
        gpsCircle=new google.maps.Circle({
          center:ll,radius:acc,map:gmap,fillColor:'#4285F4',fillOpacity:.12,strokeColor:'#4285F4',strokeOpacity:.3,strokeWeight:1
        });
        gmap.setCenter(ll);
        gmap.setZoom(17);
      } else {
        gpsMarker.setPosition(ll);
        gpsCircle.setCenter(ll);
        gpsCircle.setRadius(acc);
      }
      // Info about nearest change
      let nearIdx=0,nearD=Infinity;
      changes.forEach((ch,i)=>{const d=hd(ll,ch);if(d<nearD){nearD=d;nearIdx=i;}});
      const near=changes[nearIdx];
      if(near){
        const nextMine=myCarries.find(mc=>mc.num>near.num);
        let info='📍 Cerca del cambio #'+near.num+' (Grp #'+near.grp+')';
        if(near.n) info+=' · '+near.n;
        if(nextMine) info+='<br>Próxima cargada: #'+nextMine.ci+' (~'+nextMine.time+')';
        $('noti').innerHTML='<b style="color:#4285F4">'+info+'</b>';
        $('noti').classList.add('show');
      }
    },
    function(err){
      gpsOn=false;
      $('bGps').style.background='rgba(0,0,0,.75)';
      if(err.code===1){

let countdownInterval=null;
function startCountdown(){
  if(countdownInterval) clearInterval(countdownInterval);
  countdownInterval=setInterval(updateCountdown,30000); // every 30s
  // Also refresh projected times every 60s
  setInterval(function(){if(myCarries.length>0)renderLive();},60000);
  updateCountdown();
}
function updateCountdown(){
  const el=document.getElementById('countdownText');
  if(!el||!myCarries.length) return;
  const pending=myCarries.filter(mc=>!isDone(mc.ci)&&!(effCambio>0&&mc.num<=effCambio));
  if(pending.length===0){el.textContent='';hideAlert();return;}
  const next=pending[0];
  const est=getEstimate(next);
  const tp=est.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!tp){el.textContent='';return;}
  let h=parseInt(tp[1]),m=parseInt(tp[2]);
  if(tp[3].toUpperCase()==='PM'&&h<12)h+=12;
  if(tp[3].toUpperCase()==='AM'&&h===12)h=0;
  const now=new Date();
  const estDate=new Date();estDate.setHours(h,m,0,0);
  if(estDate<now&&(now-estDate)>12*3600000) estDate.setDate(estDate.getDate()+1);
  const diffMin=Math.round((estDate-now)/60000);
  if(diffMin<=0){
    el.innerHTML='<span style="color:#c084fc;font-weight:700">⏰ Cargada en curso</span>';
    if(navigator.vibrate&&lastAlertCi!==next.ci){navigator.vibrate([300,100,300,100,500]);lastAlertCi=next.ci;}
  } else if(diffMin<=5){
    el.innerHTML='<span style="color:#ff9800;font-weight:700">⚠️ ¡Faltan <b>~'+diffMin+' min</b>! Preparáte</span>';
    if(navigator.vibrate&&lastAlertCi!==next.ci){navigator.vibrate([200,100,200]);lastAlertCi=next.ci;}
  } else if(diffMin<=60){
    el.innerHTML='<span style="color:#c084fc">⏳ Faltan <b>~'+diffMin+' min</b> para tu cargada</span>';

  } else {
    const hrs=Math.floor(diffMin/60),mins=diffMin%60;
    el.innerHTML='<span style="color:#aaa">⏳ Faltan ~'+hrs+'h '+mins+'min</span>';

  }
}

let lastAlertCi=0, lastAlertType='';
function triggerAlert(ci,type){
  const key=ci+'-'+type;
  if(lastAlertCi===ci&&lastAlertType===type) return; // already alerted
  lastAlertCi=ci;lastAlertType=type;
  // Vibrate
  if(navigator.vibrate){
    if(type==='now') navigator.vibrate([300,100,300,100,500]); // strong
    else navigator.vibrate([200,100,200]); // medium

if('serviceWorker' in navigator){
  // Force clear old caches and SW on first load of new version
  const APP_VERSION='v42';
  if(localStorage.getItem('appVer')!==APP_VERSION){
    // Clear all caches
    if(window.caches) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));
    // Unregister old SW then register new one
    navigator.serviceWorker.getRegistrations().then(function(regs){
      return Promise.all(regs.map(r=>r.unregister()));
    }).then(function(){
      localStorage.setItem('appVer',APP_VERSION);
      navigator.serviceWorker.register('sw.js').then(setupSWUpdates);
    });
  } else {
    navigator.serviceWorker.register('sw.js').then(setupSWUpdates);
  }
  function setupSWUpdates(reg){
    setInterval(()=>reg.update(),30000);
    // No auto-reload — update applies next time user opens the app
  }
}

function advanceGrupo(delta){
  if(changes.length===0&&positions.length>0) calc();
  var tot=changes.length;
  if(tot===0) tot=positions.length;
  if(tot===0) return;
  var maxCambio=tot+virgenDesfase;
  currentGrupoActual=Math.max(0,Math.min(maxCambio,currentGrupoActual+delta));
  // Jesus grupo ALWAYS uses 21 groups and hombres saca
  var sacaH=daySaca[currentDay]||17;
  var grp=0,nombre='';
  if(currentGrupoActual>0&&currentGrupoActual<=changes.length){
    grp=((sacaH-1+currentGrupoActual-1)%21)+1;
    nombre=changes[currentGrupoActual-1].n||'';
  } else if(currentGrupoActual>0){
    grp=((sacaH-1+Math.min(currentGrupoActual,tot)-1)%21)+1;
  }
  liveGrupoData={cambio:currentGrupoActual,grp:grp,nombre:nombre,tot:tot,desfase:virgenDesfase,movidos:virgenMovidos,sacaMuj:daySacaMuj[currentDay],t:Date.now()};
  try{localStorage.setItem('grupoActual_day'+currentDay,JSON.stringify(liveGrupoData));}catch(e){}

  updateGrupoUI();
  db.ref('grupoActual/day'+currentDay).set(liveGrupoData);
}

var syncTimer=null;
function syncPositions(){
  if(isShared) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){
    var pts=positions.map(function(p){return{lat:p.lat,lng:p.lng,n:p.n||''};});
    db.ref('positions/day'+currentDay).set(pts);
  },500);
}

// ========== START ALL DAY-DEPENDENT LISTENERS (called after initMap) ==========
var activeDayRefs=[];
function stopDayListeners(){
  activeDayRefs.forEach(function(r){r.off();});
  activeDayRefs=[];
}

function startDayListeners(){
  stopDayListeners();
  // Load grupo actual from localStorage for correct day
  if(typeof loadGrupoFromStorage==='function') loadGrupoFromStorage();
  // Grupo actual
  var gaRef=db.ref('grupoActual/day'+currentDay);
  activeDayRefs.push(gaRef);
  gaRef.on('value',function(snap){
    var d=snap.val();
    if(!d){
      // Never clear if we have local data
      return;
    }
    currentGrupoActual=d.cambio||0;
    liveGrupoData=d;
    if(d.desfase!==undefined) virgenDesfase=d.desfase;
    if(d.movidos!==undefined) virgenMovidos=d.movidos;
    if(d.sacaMuj) daySacaMuj[currentDay]=d.sacaMuj;
    try{localStorage.setItem('grupoActual_day'+currentDay,JSON.stringify(d));}catch(e){}
    updateGrupoUI();
    if(typeof renderLive==='function') renderLive();
  });
  // Config sync
  if(!isShared){
    ['cS','cH','cMn'].forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.addEventListener('change',function(){setTimeout(syncConfig,100);});
    });
  }
  if(isShared){
    var cfgRef=db.ref('config/day'+currentDay);
    activeDayRefs.push(cfgRef);
    cfgRef.on('value',function(snap){
      var d=snap.val();
      if(!d) return;
      var changed=false;
      if(d.s&&+document.getElementById('cS').value!==d.s){document.getElementById('cS').value=d.s;changed=true;}
      if(d.h&&+document.getElementById('cH').value!==d.h){document.getElementById('cH').value=d.h;changed=true;}
      if(d.mn&&+document.getElementById('cMn').value!==d.mn){document.getElementById('cMn').value=d.mn;changed=true;}
      if(changed) calc();
    });
  }
  // Positions sync
  if(isShared){
    var posRef=db.ref('positions/day'+currentDay);
    activeDayRefs.push(posRef);
    posRef.on('value',function(snap){
      var d=snap.val();
      if(!d||!d.length) return;
      positions=d.map(function(p){return{lat:p.lat,lng:p.lng,n:p.n||''};});
      drawRouteLine();
      calc();
    });
  }
}

</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD_lMqEQiLroj-jhx-a9d_o-6uWFfOCbg0&libraries=geometry&callback=initMap" async defer></script>
