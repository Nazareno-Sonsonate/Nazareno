<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<!-- Landing chooser deliberately has no <link rel="manifest"> so it isn't -->
<!-- installable — visitors should install Jesús Nazareno or Santo Entierro -->
<!-- directly, each with its own narrow scope. The backwards-compat -->
<!-- manifest.json at root is still served for older installs that already -->
<!-- reference it; new visitors don't see an install banner here. -->
<meta name="theme-color" content="#1a0a1f">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Semana Santa">
<title>Semana Santa · Sonsonate</title>
<meta name="description" content="Rastreo en vivo de las procesiones de Semana Santa en Sonsonate, El Salvador — Jesús Nazareno y Santo Entierro de Cristo">
<meta property="og:title" content="Semana Santa · Sonsonate">
<meta property="og:description" content="Rastreo en vivo de las cargadas — Jesús Nazareno y Santo Entierro de Cristo">
<meta property="og:image" content="https://nazareno-sonsonate.github.io/Nazareno/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://nazareno-sonsonate.github.io/Nazareno/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<script>
// Two redirects so the landing only appears for first-time browser visits:
// 1) Legacy URLs that drop ?se=1 / ?saca=1 / ?dia=N go straight to the right app
// 2) Anyone launching the OLD installed PWA (start_url=./index.html, scope=./)
//    sees the procession app instead of the new chooser. Without this the
//    existing home-screen icon would suddenly show a chooser, breaking UX.
(function(){
  var p = new URLSearchParams(window.location.search);
  if(p.has('se')){ window.location.replace('./santo-entierro/'); return; }
  if(p.has('saca')||p.has('dia')){
    window.location.replace('./jesus-nazareno/' + window.location.search);
    return;
  }
  if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches){
    window.location.replace('./jesus-nazareno/');
  }
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#1a0a1f;color:#eee;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.hero{padding:32px 20px 16px;text-align:center}
.hero h1{font-size:13px;color:#c084fc;letter-spacing:3px;font-weight:700;margin-bottom:6px}
.hero .sub{font-size:18px;color:#eee;font-weight:600;margin-bottom:4px}
.hero .loc{font-size:13px;color:#aaa}
.choices{flex:1;display:flex;flex-direction:column;gap:14px;padding:8px 16px 32px;justify-content:center;max-width:480px;width:100%;margin:0 auto}
.choice{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:rgba(0,0,0,.35);border:2px solid transparent;text-decoration:none;color:inherit;cursor:pointer;transition:transform .1s,border-color .15s}
.choice:active{transform:scale(.98)}
.choice img{width:90px;height:90px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#000}
.choice .meta{flex:1;min-width:0}
.choice .meta h2{font-size:18px;font-weight:700;margin-bottom:4px}
.choice .meta p{font-size:13px;color:#aaa;line-height:1.4}
.choice .arrow{font-size:24px;color:#666;flex-shrink:0}
.choice.jn{border-color:#7c3aed}
.choice.jn .meta h2{color:#c084fc}
.choice.jn:active{background:rgba(124,58,237,.12)}
.choice.se{border-color:#666}
.choice.se .meta h2{color:#e8e8e8}
.choice.se{background:rgba(0,0,0,.55)}
.choice.se:active{background:rgba(255,255,255,.06)}
.foot{text-align:center;padding:14px;font-size:11px;color:#666;line-height:1.5}
.foot a{color:#888;text-decoration:underline}
@media (min-height:680px){.hero{padding-top:48px}}
</style>
</head>
<body>
<div class="hero">
  <h1>✝️ SEMANA SANTA</h1>
  <div class="sub">Sonsonate · El Salvador</div>
  <div class="loc">Elegí tu procesión</div>
</div>
<div class="choices">
  <a href="./jesus-nazareno/" class="choice jn">
    <img src="jesus.jpg" alt="Jesús Nazareno">
    <div class="meta">
      <h2>Jesús Nazareno</h2>
      <p>Procesión de Lunes a Viernes Santo · 21 grupos</p>
    </div>
    <div class="arrow">→</div>
  </a>
  <a href="./santo-entierro/" class="choice se">
    <img src="se-entierro.jpg" alt="Santo Entierro">
    <div class="meta">
      <h2>⚱️ Santo Entierro</h2>
      <p>Viernes Santo (noche) · 22 grupos</p>
    </div>
    <div class="arrow">→</div>
  </a>
</div>
<div class="foot">
  Rastreo en vivo de cargadas · ubicación · horarios<br>
  <a href="./jesus-nazareno/?edit=1">Acceso administrador</a>
</div>
</body>
</html>
