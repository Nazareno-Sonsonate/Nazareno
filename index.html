.cfg{margin:4px 8px;padding:8px;background:rgba(0,0,0,.25);border-radius:6px;border:1px solid rgba(139,105,20,.3);display:none}

.cfg label{font-size:9px;color:#8a7a5a;display:block}

.notice{text-align:center;padding:4px;font-size:11px;color:#d4af37;background:rgba(212,175,55,.1);display:none}
.notice.show{display:block}
.vtabs{display:flex;border-bottom:1px solid rgba(139,105,20,.2)}
.vtab{flex:1;padding:7px;text-align:center;cursor:pointer;font-size:11px;font-weight:600;color:#8a7a5a;border:none;background:none}
.vtab.a{color:#d4af37;border-bottom:2px solid #d4af37;margin-bottom:-1px}
.pnl{display:none}.pnl.a{display:block}
.tbl{margin:6px;background:rgba(0,0,0,.2);border-radius:6px;border:1px solid rgba(139,105,20,.3);overflow:hidden;max-height:50vh;overflow-y:auto}
.tbl .th{display:grid;grid-template-columns:30px 1fr 60px;padding:5px 6px;font-size:10px;font-weight:700;color:#d4af37;background:rgba(139,105,20,.15);position:sticky;top:0}
.tbl .tr{display:grid;grid-template-columns:30px 1fr 60px;padding:5px 6px;cursor:pointer;border-bottom:1px solid rgba(139,105,20,.06);font-size:11px}
.tbl .tr:active{background:rgba(212,175,55,.1)}

.tbl .rs{font-size:9px;color:#8a7a5a}

.rfloat{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:2000;background:#d4af37;color:#1a0a02;font-weight:700;font-size:12px;padding:9px 18px;border-radius:22px;box-shadow:0 3px 12px rgba(212,175,55,.5);cursor:pointer;border:none}

{n:'Grupo 1 (Ida)',lat:13.7232966,lng:-89.7198558},{n:'Grupo 2 (Regreso)',lat:13.7235413,lng:-89.7195569},{n:'Grupo 3 (Regreso)',lat:13.7232521,lng:-89.7197886},
{n:'Grupo 4 (Regreso)',lat:13.7229667,lng:-89.7200247},{n:'Grupo 5 (Regreso)',lat:13.7226892,lng:-89.7203539},{n:'Grupo 6',lat:13.722384,lng:-89.720583},
{n:'Grupo 7',lat:13.7220443,lng:-89.7208097},{n:'Grupo 8',lat:13.7216614,lng:-89.721066},{n:'Grupo 9',lat:13.7212652,lng:-89.7213262},
{n:'Grupo 10',lat:13.7208859,lng:-89.7216059},{n:'Grupo 11',lat:13.7205267,lng:-89.7218667},{n:'Grupo 12',lat:13.720169,lng:-89.7221217},
{n:'Grupo 13',lat:13.7198094,lng:-89.7223679},{n:'Grupo 14',lat:13.7194821,lng:-89.7225958},{n:'Grupo 15',lat:13.7196932,lng:-89.7229097},
{n:'Grupo 16 (Entra)',lat:13.7199589,lng:-89.7232262}
];
// Lunes reference waypoints
const LUN_WP_REF=[
{n:"Catedral",lat:13.7205038,lng:-89.7268142},
{n:"Veracruz",lat:13.7182537,lng:-89.7291377},
{n:"Megaplaza",lat:13.7175267,lng:-89.7295749},
{n:"Sensunapán",lat:13.7110173,lng:-89.7302323},
{n:"COED Brito",lat:13.7177813,lng:-89.7261697},
{n:"Selectos",lat:13.7192706,lng:-89.7253634},
{n:"IPS",lat:13.7210786,lng:-89.7243618},
];

// ========== STATE ==========
let gmap, infoWin, routeLine, routeClickLine;
let currentDay = 0; // 0=lunes,1=martes,2=miercoles
let positions = []; // current day's change positions [{lat,lng,n?}]
let changes = [], myCarries = [];
let allMarkers = [], wpMarkers = [], showAll = true, dragMode = false;
let dayNames = ['Lunes Santo','Martes Santo','Miércoles Santo'];
let dayHours = [15, 18, 15]; // default start hours per day
let daySaca = [19, 19, 19]; // grupo que saca per day (configurable)

// Saved positions per day
let savedPositions = [null, null, null];
let savedRefs = [null, null, null]; // saved reference waypoints per day

// ========== MARTES: reference waypoints (starts empty, user adds) ==========
let MART_WP_REF = [];

// ========== LOCAL STORAGE ==========
const SAVE_KEY = 'semanaSanta_v5';
function getWPs(){return currentDay===0?LUN_WP_REF:currentDay===1?MART_WP_REF:currentDay===2?MIER_WP_REF:[];}
function saveAll() {
  try {
    savedPositions[currentDay] = positions.map(p=>({lat:p.lat,lng:p.lng,n:p.n||''}));
    savedRefs[currentDay] = getWPs().map(w=>({lat:w.lat,lng:w.lng,n:w.n}));
    const data = {
      sp: savedPositions, sr: savedRefs,
      sc: daySaca, sh: dayHours,
      cfg: {g:+$('cG').value,t:+$('cT').value,mn:+$('cMn').value},
      cd: currentDay
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch(e) {}
}
function loadSaved() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d.sp) savedPositions = d.sp;
    if(d.sr) savedRefs = d.sr;
    if(d.sc) daySaca = d.sc;
    if(d.sh) dayHours = d.sh;
    if(d.cfg){$('cG').value=d.cfg.g||5;$('cT').value=d.cfg.t||21;$('cMn').value=d.cfg.mn||6;}
    if(typeof d.cd==='number') currentDay = d.cd;
    // Restore saved refs into the arrays
    if(savedRefs[0]&&savedRefs[0].length){LUN_WP_REF.length=0;savedRefs[0].forEach(r=>LUN_WP_REF.push(r));}
    if(savedRefs[1]&&savedRefs[1].length){MART_WP_REF.length=0;savedRefs[1].forEach(r=>MART_WP_REF.push(r));}
    if(savedRefs[2]&&savedRefs[2].length){MIER_WP_REF.length=0;savedRefs[2].forEach(r=>MIER_WP_REF.push(r));}
    return true;
  } catch(e){return false;}
}
function resetData(){
  if(!confirm('¿Borrar TODO el progreso guardado?')) return;
  localStorage.removeItem(SAVE_KEY);
  savedPositions=[null,null,null];savedRefs=[null,null,null];
  location.reload();
}

// Touch guard
let lastMulti = 0;
document.addEventListener('touchstart', e => { if(e.touches.length>1) lastMulti=Date.now(); }, {passive:true});
function isZoom() { return Date.now()-lastMulti<500; }

const $ = id => document.getElementById(id);
function cfg() {
  return {g:+$('cG').value||5, t:+$('cT').value||21, s:+$('cS').value||19, h:+$('cH').value||15, mn:+$('cMn').value||3};
}
function fmt(min) {
  let h=Math.floor(min/60), m=Math.round(min%60);
  if(m===60){h++;m=0}
  let h12=((h-1)%12)+1; if(h12<=0)h12+=12;
  return h12+':'+String(m).padStart(2,'0')+' '+(h>=12&&h<24?'PM':'AM');
}
function hd(a,b){const R=6371000,d1=(b.lat-a.lat)*Math.PI/180,d2=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(d1/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(d2/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function placeAlong(path,intv){const r=[];if(path.length<2)return r;let a=0;for(let i=1;i<path.length;i++){const p=path[i-1],q=path[i],s=hd(p,q);if(s<.1)continue;let u=0;while(a+(s-u)>=intv){const ad=intv-a;u+=ad;const f=u/s;r.push({lat:p.lat+(q.lat-p.lat)*f,lng:p.lng+(q.lng-p.lng)*f});a=0;}a+=(s-u);}return r;}

// ========== INIT ==========
function initMap() {
  gmap = new google.maps.Map($('map'), {
    center:{lat:13.717,lng:-89.729}, zoom:15,
    mapTypeControl:false, streetViewControl:false, fullscreenControl:false,
    gestureHandling:'greedy', // one finger moves map, two fingers zoom
    styles:[] // show all default Google Maps labels
  });
  infoWin = new google.maps.InfoWindow();
  const hasSaved = loadSaved();
  // Restore day tabs
  document.querySelectorAll('.day').forEach((b,i)=>b.classList.toggle('a',i===currentDay));
  $('cS').value = daySaca[currentDay];
  $('cH').value = dayHours[currentDay];
  loadDay(currentDay);
}

// ========== DAY SWITCHING ==========
function switchDay(d) {
  // Save current day's state
  daySaca[currentDay] = +$('cS').value||19;
  dayHours[currentDay] = +$('cH').value||15;
  saveAll();

  currentDay = d;
  document.querySelectorAll('.day').forEach((b,i) => b.classList.toggle('a',i===d));

  // Restore config for this day
  $('cS').value = daySaca[d];
  $('cH').value = dayHours[d];

  loadDay(d);
}

function loadDay(d) {
  // Clear map
  allMarkers.forEach(m=>m.setMap(null));
  wpMarkers.forEach(m=>m.setMap(null));
  allMarkers=[]; wpMarkers=[];
  if(routeLine){routeLine.setMap(null);routeLine=null;}
  if(routeClickLine){routeClickLine.setMap(null);routeClickLine=null;}
  $('noti').classList.remove('show');

  // Check if we have saved positions for this day
  if(savedPositions[d] && savedPositions[d].length > 0) {
    positions = savedPositions[d].map(p=>({lat:p.lat,lng:p.lng,n:p.n||''}));
    drawRouteLine();
    calc();
    fitBounds();
    return;
  }

  // No saved data — use defaults
  if(d === 0) {
    positions = LUN_PTS.map(p=>({lat:p.lat,lng:p.lng,n:p.n}));
    drawRouteLine();
    calc();
    fitBounds();
  } else if(d === 2) {
    positions = MIER_PTS.map(p=>({lat:p.lat,lng:p.lng,n:p.n}));
    drawRouteLine();
    calc();
    fitBounds();
  } else {
    positions = [];
    $('noti').textContent = 'Martes: Tocá la línea verde para agregar cambios o subí un KML';
    $('noti').classList.add('show');
    calc();
  }
}

// ========== MIÉRCOLES: draw polyline through exact points ==========
function drawRouteLine() {
  if(routeLine) routeLine.setMap(null);
  if(routeClickLine) routeClickLine.setMap(null);
  const path = positions.map(p=>({lat:p.lat,lng:p.lng}));
  routeLine = new google.maps.Polyline({
    path, map:gmap, strokeColor:'#4CAF50', strokeWeight:5, strokeOpacity:.8, zIndex:1
  });
  // Fat invisible line for easy tapping
  routeClickLine = new google.maps.Polyline({
    path, map:gmap, strokeColor:'#4CAF50', strokeWeight:25, strokeOpacity:0.01, zIndex:2
  });
  routeClickLine.addListener('click', function(e){
    if(isZoom()) return;
    insertAtPosition(e.latLng.lat(), e.latLng.lng());
  });
}

function fitBounds() {
  if(positions.length<2) return;
  const b = new google.maps.LatLngBounds();
  positions.forEach(p=>b.extend(p));
  gmap.fitBounds(b,{top:20,bottom:20,left:20,right:20});
}

// ========== INSERT CHANGE (tap on route line) ==========
function insertAtPosition(lat,lng) {
  if(positions.length<1) return;

  // Find which two consecutive positions the click falls between
  let bestSeg=0, bestD=Infinity;
  for(let i=0;i<positions.length-1;i++){
    // Distance from click to segment midpoint
    const mid={lat:(positions[i].lat+positions[i+1].lat)/2, lng:(positions[i].lng+positions[i+1].lng)/2};
    const d=hd({lat,lng},mid);
    if(d<bestD){bestD=d;bestSeg=i;}
  }
  // Also check distance to each point to find exact insert position
  let bestPt=0, bestPtD=Infinity;
  for(let i=0;i<positions.length;i++){
    const d=hd({lat,lng},positions[i]);
    if(d<bestPtD){bestPtD=d;bestPt=i;}
  }

  // Insert after the nearest point if click is past it, before if click is before it
  let insertIdx;
  if(bestPt===0){
    // Near start: check if before or after first point
    insertIdx=0; // insert before first
  } else if(bestPt===positions.length-1){
    insertIdx=positions.length; // insert after last
  } else {
    // Between bestPt-1 and bestPt: which side?
    const dPrev=hd({lat,lng},positions[bestPt-1]);
    const dNext=hd({lat,lng},positions[bestPt]);
    insertIdx = dPrev<dNext ? bestPt : bestPt+1;
  }

  // Insert new position
  positions.splice(insertIdx,0,{lat,lng,n:'Cambio insertado'});

  calc();
  if(currentDay===2) drawRouteLine();

  // Show confirmation with correct number
  const c=cfg();
  const grp=((c.s-1+insertIdx)%c.t)+1;
  const num=insertIdx+1;
  infoWin.setContent('<div style="text-align:center;font-family:Georgia"><b style="color:#4CAF50">✅ Cambio #'+num+'</b><br>Grupo <b>#'+grp+'</b><br><span style="font-size:10px;color:#888">Secuencia actualizada</span></div>');
  infoWin.setPosition({lat,lng});
  infoWin.open(gmap);
  setTimeout(()=>infoWin.close(),2500);
}

// ========== CALCULATE ==========
function calc() {
  const c=cfg();
  const tot=positions.length;

  changes=positions.map((p,i)=>{
    const num=i+1;
    const grp=((c.s-1+i)%c.t)+1;
    const time=c.h*60+num*c.mn;
    return {num,grp,time:fmt(time),lat:p.lat,lng:p.lng,n:p.n||'',mine:grp===c.g};
  });
  myCarries=changes.filter(ch=>ch.mine);
  myCarries.forEach((mc,i)=>mc.ci=i+1);

  let totalM=0;
  for(let i=1;i<positions.length;i++) totalM+=hd(positions[i-1],positions[i]);
  const km=(totalM/1000).toFixed(2);

  $('stats').innerHTML=[
    {v:'#'+c.g,l:'Tu Turno'},{v:myCarries.length,l:'Cargadas'},
    {v:tot,l:'Cambios'},{v:km+'km',l:'Distancia'},
  ].map(x=>'<div style="text-align:center"><div class="v">'+x.v+'</div><div class="l">'+x.l+'</div></div>').join('');

  $('hSub').textContent=dayNames[currentDay]+' · Salida: '+fmt(c.h*60)+' · Saca: #'+c.s+' · '+km+' km';
  $('ftr').innerHTML='<b>'+dayNames[currentDay]+'</b> · Saca: #'+c.s+' · '+tot+' cambios · Tu grupo (#'+c.g+') en dorado. <b>Tocá la línea verde</b> para insertar. 💾 Guardado auto.';

  renderTable();
  renderMarkers();
  renderWPmarkers();
  saveAll(); // auto-save after every change
}

// ========== WAYPOINT REFERENCE MARKERS ==========
function renderWPmarkers() {
  wpMarkers.forEach(m=>m.setMap(null));
  wpMarkers=[];
  const wps = getWPs();
  wps.forEach((wp,i)=>{
    const mk=new google.maps.Marker({
      position:{lat:wp.lat,lng:wp.lng}, map:gmap,
      label:{text:'◆',color:'#d4af37',fontWeight:'bold',fontSize:'10px'},
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:dragMode?16:12,
        fillColor:'#3d2a0a',fillOpacity:.9,
        strokeColor:'#8b6914',strokeWeight:2},
      zIndex:5000, draggable:dragMode
    });
    mk.addListener('click',function(){
      if(isZoom())return;
      const del='<br><button onclick="deleteRef('+i+')" style="margin-top:4px;padding:4px 10px;border:none;border-radius:4px;background:#c0392b;color:#fff;font-size:11px;font-weight:600;cursor:pointer">🗑️ Eliminar</button>';
      const drag=dragMode?'<br><i style="font-size:10px;color:#888">Arrastrá para mover</i>':'';
      infoWin.setContent('<div style="text-align:center;font-family:Georgia"><b>'+wp.n+'</b><br><span style="font-size:10px;color:#8a7a5a">Referencia</span>'+drag+del+'</div>');
      infoWin.open(gmap,mk);
    });
    if(dragMode){
      mk.addListener('dragend',function(){
        const p=mk.getPosition();
        wps[i].lat=p.lat(); wps[i].lng=p.lng();
        saveAll();
      });
    }
    wpMarkers.push(mk);
  });
}

function addRef(){
  const name=prompt('Nombre de la referencia:');
  if(!name) return;
  const center=gmap.getCenter();
  const wps=getWPs();
  wps.push({n:name,lat:center.lat(),lng:center.lng()});
  renderWPmarkers();
  saveAll();
}

function deleteRef(i){
  const wps=getWPs();
  if(i<0||i>=wps.length) return;
  wps.splice(i,1);
  infoWin.close();
  renderWPmarkers();
  saveAll();
}

// ========== MARKERS ==========
function renderMarkers() {
  allMarkers.forEach(m=>m.setMap(null));
  allMarkers=[];

  changes.forEach((ch,ci)=>{
    if(!showAll&&!ch.mine) return;
    const m=ch.mine;
    const sc=m?(dragMode?18:13):(dragMode?12:7);
    const fc=m?'#d4af37':'cornflowerblue';
    const mk=new google.maps.Marker({
      position:{lat:ch.lat,lng:ch.lng},map:gmap,
      label:{text:String(ch.grp),color:m?'#1a0a02':'#fff',fontWeight:'bold',fontSize:m?'11px':'7px'},
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:sc,fillColor:fc,fillOpacity:m?1:.5,strokeColor:m?'#fff':'cornflowerblue',strokeWeight:m?3:1},
      zIndex:m?3000:100, draggable:dragMode
    });
    mk.addListener('click',function(){
      if(isZoom())return;
      const tag=m?'<br><b style="color:#d4af37">🏋️ Tu cargada #'+ch.ci+'</b>':'';
      const ref=ch.n?'<br><span style="font-size:10px;color:#8a7a5a">'+ch.n+'</span>':'';
      const drag=dragMode?'<br><i style="font-size:10px;color:#888">Arrastrá para mover</i>':'';
      const del='<br><button onclick="deleteChange('+ci+')" style="margin-top:4px;padding:4px 10px;border:none;border-radius:4px;background:#c0392b;color:#fff;font-size:11px;font-weight:600;cursor:pointer">🗑️ Eliminar</button>';
      infoWin.setContent('<div style="text-align:center;font-family:Georgia;min-width:130px">Grupo <b>#'+ch.grp+'</b><br>Cambio #'+ch.num+'<br>~'+ch.time+tag+ref+drag+del+'</div>');
      infoWin.open(gmap,mk);
    });
    if(dragMode){
      mk.addListener('dragend',function(){
        const p=mk.getPosition();
        positions[ci]={lat:p.lat(),lng:p.lng(),n:positions[ci].n};
        drawRouteLine(); // update route to follow new position
        calc();
      });
    }
    allMarkers.push(mk);
  });
}

// ========== DELETE CHANGE ==========
function deleteChange(ci) {
  if(ci<0||ci>=positions.length) return;
  const removed = positions[ci];
  positions.splice(ci, 1);
  infoWin.close();
  drawRouteLine();
  calc();
}

// ========== TABLE ==========
function renderTable() {
  let h='<div class="th"><span>#</span><span>Ubicación / Referencia</span><span style="text-align:right">Hora</span></div>';
  myCarries.forEach((mc,i)=>{
    const ref=mc.n||nearWP(mc);
    h+='<div class="tr" onclick="zoomTo('+i+')"><span class="rn">'+mc.ci+'</span><div><div style="font-weight:600">'+ref+'</div><div class="rs">Cambio #'+mc.num+' · Grp #'+mc.grp+'</div></div><div class="rt">'+mc.time+'</div></div>';
  });
  $('tbl').innerHTML=h;
}
function nearWP(p){
  const wps = getWPs();
  let b='Punto',bd=1e9;
  wps.forEach(w=>{const d=hd(p,w);if(d<bd){bd=d;b=w.n;}});
  return b;
}
function zoomTo(i){
  if(!myCarries[i])return;
  showView(0);
  const mc=myCarries[i];
  gmap.setCenter({lat:mc.lat,lng:mc.lng});
  gmap.setZoom(18);
  const t=allMarkers.find(m=>{const p=m.getPosition();return Math.abs(p.lat()-mc.lat)<.00005&&Math.abs(p.lng()-mc.lng)<.00005;});
  if(t) google.maps.event.trigger(t,'click');
}

// ========== UI ==========
function toggleDrag(){dragMode=!dragMode;$('bDrag').classList.toggle('on',dragMode);renderMarkers();renderWPmarkers();}
function toggleAll(){showAll=!showAll;$('bAll').classList.toggle('on',showAll);renderMarkers();}
function showView(n){document.querySelectorAll('.vtab').forEach((t,i)=>t.classList.toggle('a',i===n));document.querySelectorAll('.pnl').forEach((p,i)=>p.classList.toggle('a',i===n));}

// ========== GPS TRACKING ==========
let gpsMarker=null, gpsCircle=null, gpsWatchId=null, gpsOn=false;

function toggleGps(){
  if(gpsOn){
    if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}
    if(gpsMarker){gpsMarker.setMap(null);gpsMarker=null;}
    if(gpsCircle){gpsCircle.setMap(null);gpsCircle=null;}
    gpsOn=false;
    $('bGps').classList.remove('on');
    $('noti').classList.remove('show');
    calc(); // restore footer
    return;
  }
  if(!navigator.geolocation){
    $('noti').textContent='❌ Tu navegador no soporta GPS';
    $('noti').classList.add('show');
    return;
  }
  gpsOn=true;
  $('bGps').classList.add('on');
  $('noti').textContent='📍 Buscando ubicación...';
  $('noti').classList.add('show');

  gpsWatchId=navigator.geolocation.watchPosition(
    function(pos){
      const lat=pos.coords.latitude, lng=pos.coords.longitude, acc=pos.coords.accuracy;
      const ll={lat,lng};
      $('noti').classList.remove('show');
      if(!gpsMarker){
        gpsMarker=new google.maps.Marker({
          position:ll, map:gmap, zIndex:9000,
          icon:{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:'#4285F4',fillOpacity:1,strokeColor:'#fff',strokeWeight:3}
        });
        gpsCircle=new google.maps.Circle({
          center:ll,radius:acc,map:gmap,fillColor:'#4285F4',fillOpacity:.12,strokeColor:'#4285F4',strokeOpacity:.3,strokeWeight:1
        });
        gmap.setCenter(ll);
        gmap.setZoom(17);
      } else {
        gpsMarker.setPosition(ll);
        gpsCircle.setCenter(ll);
        gpsCircle.setRadius(acc);
      }
      // Info about nearest change
      let nearIdx=0,nearD=Infinity;
      changes.forEach((ch,i)=>{const d=hd(ll,ch);if(d<nearD){nearD=d;nearIdx=i;}});
      const near=changes[nearIdx];
      if(near){
        const nextMine=myCarries.find(mc=>mc.num>near.num);
        let info='📍 Cerca del cambio #'+near.num+' (Grp #'+near.grp+')';
        if(near.n) info+=' · '+near.n;
        if(nextMine) info+='<br>Próxima cargada: #'+nextMine.ci+' (~'+nextMine.time+')';
        $('ftr').innerHTML='<b style="color:#4285F4">'+info+'</b>';
      }
    },
    function(err){
      gpsOn=false;
      $('bGps').classList.remove('on');
      if(err.code===1){
        $('noti').innerHTML='❌ Permiso denegado.<br>Si abriste el archivo descargado, el GPS no funciona por seguridad del navegador.<br><b>Solución:</b> Abrí la app desde Claude (sin descargar) o subila a un hosting HTTPS.';
      } else if(err.code===2){
        $('noti').textContent='❌ GPS no disponible. Activá la ubicación en Ajustes del cel.';
      } else {
        $('noti').textContent='❌ Tiempo agotado. Asegurate de tener GPS activado.';
      }
      $('noti').classList.add('show');
    },
    {enableHighAccuracy:true, maximumAge:5000, timeout:10000}
  );
}
